services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ellipsis
      POSTGRES_PASSWORD: ellipsis
      POSTGRES_DB: ellipsis
    ports: ["5432:5432"]
    volumes: ["postgres_data:/var/lib/postgresql/data"]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ellipsis -d ellipsis"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports: ["6379:6379"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  migrations:
    build:
      context: .
      dockerfile: Dockerfile.api
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://ellipsis:ellipsis@postgres:5432/ellipsis
    depends_on:
      postgres:
        condition: service_healthy

  api:
    build:
      context: .
      dockerfile: Dockerfile.api
    environment:
      DATABASE_URL: postgresql+asyncpg://ellipsis:ellipsis@postgres:5432/ellipsis
      REDIS_URL: redis://redis:6379/0
    ports: ["8000:8000"]
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  worker:
    build:
      context: .
      dockerfile: Dockerfile.worker
    environment:
      DATABASE_URL: postgresql+asyncpg://ellipsis:ellipsis@postgres:5432/ellipsis
      REDIS_URL: redis://redis:6379/0
    depends_on:
      migrations:
        condition: service_completed_successfully
      redis:
        condition: service_healthy

  web:
    build: ./web
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
      AUTH_SECRET: change-me-in-development
    ports: ["3000:3000"]
    depends_on: [api]

volumes:
  postgres_data:
