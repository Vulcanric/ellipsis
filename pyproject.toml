[project]
name = "ellipsis"
version = "0.1.0"
description = "Autonomous web and mobile agent control plane"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.8,<3",
  "mcp>=1.2,<2",
  "playwright>=1.48,<2",
  "sqlalchemy[asyncio]>=2.0,<3",
  "asyncpg>=0.29,<1",
  "redis>=5,<6",
  "arq>=0.26,<1",
  "alembic>=1.13,<2",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["services*"]
exclude = ["web*", "migrations*"]

[project.optional-dependencies]
dev = [
  "httpx>=0.27,<1",
  "pytest>=8,<9",
  "pytest-asyncio>=0.24,<1",
  "aiosqlite>=0.20,<1",
]

[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"

[tool.alembic]
script_location = "migrations"

[tool.ruff]
line-length = 100

default = "services"
